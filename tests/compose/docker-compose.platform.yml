# Minimal OasisPlatform stack used by tests/test_platform_runs.py
#
# Started by testcontainers' DockerCompose with exactly one API variant profile:
#
#   --profile v2   server + v2-worker-monitor (also serves the 'task-controller' queue)
#   --profile v1   server + v1-worker-monitor
#   --profile channel-layer   optional redis, only needed for server images < 2.5.7
#                             (also set DISABLE_WORKER_WS=false)
#
# Model workers are not started from this file directly.  Each model that supports
# platform tests has a `<Model>/docker/worker-container.yml`, which 'extends' the
# `worker` template below and adds its model id and data mounts.  The fixture
# passes one of those files per selected model as an extra `-f`.
#
# Variables (set by the fixture through an env file, defaults shown):
#   SERVER_IMG=coreoasis/api_server:latest
#   WORKER_IMG=coreoasis/model_worker:latest
#   API_VER=v2
#   OASIS_DEBUG=0
#   DISABLE_WORKER_WS=true
#   OASIS_MODELS_ROOT=../..       (repo root, relative to this directory)
#   SERVER_PORT=0                 (API host port, 0 = random)
#
# Not included compared to a full platform: websocket (asgi), celery-beat.
#
# Can also be run by hand, e.g.
#   docker compose -f tests/compose/docker-compose.platform.yml \
#                  -f PiWind/docker/worker-container.yml --profile v2 up -d --wait

x-db-env: &db-env
  OASIS_DEBUG: ${OASIS_DEBUG:-0}
  OASIS_CELERY_BROKER_URL: "amqp://rabbit:rabbit@broker:5672"
  OASIS_SERVER_DB_HOST: server-db
  OASIS_SERVER_DB_PASS: oasis
  OASIS_SERVER_DB_USER: oasis
  OASIS_SERVER_DB_NAME: oasis
  OASIS_SERVER_DB_PORT: 5432
  OASIS_SERVER_DB_ENGINE: django.db.backends.postgresql_psycopg2
  OASIS_CELERY_DB_ENGINE: db+postgresql+psycopg2
  OASIS_CELERY_DB_HOST: celery-db
  OASIS_CELERY_DB_PASS: password
  OASIS_CELERY_DB_USER: celery
  OASIS_CELERY_DB_NAME: celery
  OASIS_CELERY_DB_PORT: 5432
  OASIS_TASK_CONTROLLER_QUEUE: task-controller
  OASIS_INPUT_GENERATION_CONTROLLER_QUEUE: task-controller    # names before 2.3.1
  OASIS_LOSSES_GENERATION_CONTROLLER_QUEUE: task-controller

x-server-env: &server-env
  <<: *db-env
  OASIS_URL_SUB_PATH: 0
  OASIS_SERVER_CHANNEL_LAYER_HOST: channel-layer
  OASIS_DISABLE_WORKER_WS: ${DISABLE_WORKER_WS:-true}

x-server-depends: &server-depends
  server-db:
    condition: service_healthy
  celery-db:
    condition: service_healthy
  broker:
    condition: service_healthy

volumes:
  shared-fs:

services:
  # --------------------------------------------------------------------- #
  # infrastructure
  # --------------------------------------------------------------------- #
  server-db:
    image: postgres:16
    environment:
      POSTGRES_DB: oasis
      POSTGRES_USER: oasis
      POSTGRES_PASSWORD: oasis
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "oasis", "-d", "oasis"]
      interval: 2s
      retries: 60

  celery-db:
    image: postgres:16
    environment:
      POSTGRES_DB: celery
      POSTGRES_USER: celery
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "celery", "-d", "celery"]
      interval: 2s
      retries: 60

  broker:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 60

  channel-layer:
    image: redis:7
    profiles: ["channel-layer"]

  # --------------------------------------------------------------------- #
  # platform
  # --------------------------------------------------------------------- #
  server:
    image: ${SERVER_IMG:-coreoasis/api_server:latest}
    profiles: ["v1", "v2"]
    environment:
      <<: *server-env
      STARTUP_RUN_MIGRATIONS: "true"
      OASIS_ADMIN_USER: admin
      OASIS_ADMIN_PASS: password
    ports:
      - "${SERVER_PORT:-0}:8000"   # 0 = random host port (test fixture looks it up); PiWind/.env sets 8000
    volumes:
      - shared-fs:/shared-fs:rw
    depends_on: *server-depends
    healthcheck:
      # the api_server image has no shell or curl
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck/', timeout=5)"]
      interval: 3s
      retries: 100

  v1-worker-monitor:
    image: ${SERVER_IMG:-coreoasis/api_server:latest}
    profiles: ["v1"]
    command: [celery, -A, src.server.oasisapi.celery_app_v1, worker, --loglevel=INFO, -Q, celery]
    environment: *server-env
    volumes:
      - shared-fs:/shared-fs:rw
    depends_on: *server-depends

  v2-worker-monitor:
    image: ${SERVER_IMG:-coreoasis/api_server:latest}
    profiles: ["v2"]
    # also consumes the 'task-controller' queue, replacing a separate v2-task-controller
    command: [celery, -A, src.server.oasisapi.celery_app_v2, worker, --loglevel=INFO, -Q, "celery-v2,task-controller"]
    environment: *server-env
    volumes:
      - shared-fs:/shared-fs:rw
    depends_on: *server-depends

  # --------------------------------------------------------------------- #
  # model worker template (never started directly)
  #   <Model>/docker/worker-container.yml `extends` this and adds:
  #     profiles: ["v1", "v2"]
  #     OASIS_MODEL_ID, OASIS_MODEL_SETTINGS_FILE
  #     volumes: model data + /home/worker/model/oasislmf.json
  # --------------------------------------------------------------------- #
  worker:
    image: ${WORKER_IMG:-coreoasis/model_worker:latest}
    profiles: ["worker-template"]
    environment:
      <<: *db-env
      OASIS_MODEL_SUPPLIER_ID: OasisLMF
      OASIS_MODEL_VERSION_ID: ${API_VER:-v2}
      OASIS_RUN_MODE: ${API_VER:-v2}
    volumes:
      - shared-fs:/shared-fs:rw
    depends_on:
      server:
        condition: service_healthy
