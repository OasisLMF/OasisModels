# PiCyberPreAnalysis model worker for the platform integration tests (tests/test_platform_runs.py)
#
# Extends the `worker` template in tests/compose/docker-compose.platform.yml, which must be
# the first compose file. Relative paths here resolve against that file's directory
# (tests/compose), so model paths use OASIS_MODELS_ROOT (default: the repo root).
#
# Run by hand: see PiCyberPreAnalysis/docker-compose.yml (`cd PiCyberPreAnalysis && docker compose up -d --wait`)

services:
  worker-picyberpreanalysis:
    extends:
      file: docker-compose.platform.yml
      service: worker
    profiles: ["v1", "v2"]
    environment:
      OASIS_MODEL_ID: PiCyberPreAnalysis
    volumes:
      - ${OASIS_MODELS_ROOT:-../..}/PiCyberPreAnalysis/keys_data:/home/worker/model/keys_data:ro
      - ${OASIS_MODELS_ROOT:-../..}/PiCyberPreAnalysis/model_data:/home/worker/model/model_data:ro
      - ${OASIS_MODELS_ROOT:-../..}/PiCyberPreAnalysis/docker/oasislmf.json:/home/worker/model/oasislmf.json:ro
      # pre-analysis hook, post-analysis check and the hook's settings
      - ${OASIS_MODELS_ROOT:-../..}/PiCyberPreAnalysis/src:/home/worker/model/src:ro
      - ${OASIS_MODELS_ROOT:-../..}/PiCyberPreAnalysis/docker/exposure_pre_analysis.json:/home/worker/model/exposure_pre_analysis.json:ro
