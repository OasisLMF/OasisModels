# PiWind on the minimal OasisPlatform test stack
#
# Combines the shared platform stack with PiWind's model worker:
#   ../tests/compose/docker-compose.platform.yml   server, databases, broker, worker monitor
#   docker/worker-container.yml                    PiWind model worker
#
# From this directory (profile v2 is the default, set in .env):
#   docker compose up -d --wait
#   API_VER=v1 COMPOSE_PROFILES=v1 docker compose up -d --wait   # v1 API / worker mode instead
#   docker compose down -v
#
# Images: SERVER_IMG / WORKER_IMG (default coreoasis/api_server:latest, coreoasis/model_worker:latest)
# The API is published on a random host port: `docker compose port server 8000`

include:
  - path:
      - ../tests/compose/docker-compose.platform.yml
      - docker/worker-container.yml
