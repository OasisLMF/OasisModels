# PiCyber model worker for the platform integration tests (tests/test_platform_runs.py)
#
# Extends the `worker` template in tests/compose/docker-compose.platform.yml, which must be
# the first compose file. Relative paths here resolve against that file's directory
# (tests/compose), so model paths use OASIS_MODELS_ROOT (default: the repo root).
#
# Run by hand: see PiCyber/docker-compose.yml (`cd PiCyber && docker compose up -d --wait`)

services:
  worker-picyber:
    extends:
      file: docker-compose.platform.yml
      service: worker
    profiles: ["v1", "v2"]
    environment:
      OASIS_MODEL_ID: PiCyber
    volumes:
      - ${OASIS_MODELS_ROOT:-../..}/PiCyber/keys_data:/home/worker/model/keys_data:ro
      - ${OASIS_MODELS_ROOT:-../..}/PiCyber/model_data:/home/worker/model/model_data:ro
      - ${OASIS_MODELS_ROOT:-../..}/PiCyber/docker/oasislmf.json:/home/worker/model/oasislmf.json:ro
